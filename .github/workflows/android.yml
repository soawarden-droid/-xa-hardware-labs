name: XA PHANTOM Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XA-PHANTOM.apk
          gh release delete v1.0.0-test --yes --cleanup-tag || true
          gh release create v1.0.0-test XA-PHANTOM.apk --target "$GITHUB_SHA" --title "XA PHANTOM v1.0.0 Test" --notes "Experimental Android network diagnostics and security learning toolkit. Debug-signed test build." --prerelease
